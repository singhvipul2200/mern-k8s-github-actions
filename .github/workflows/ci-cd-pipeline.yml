# ============================================================
# Name of this workflow
# ============================================================
name: MERN Notes App CI/CD Pipeline

# ============================================================
# Triggers: Push to main OR Manual Trigger
# ============================================================
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this pipeline manually?"
        required: false
        default: "Manual Trigger"

jobs:

# ============================================================
# JOB 1 - UNIT TESTS
# ============================================================
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      # NOTE: Backend has no test script, skipping unit tests
      - name: Backend Tests (Skipped)
        working-directory: backend
        run: echo "⚠️ No test script found in backend/package.json — skipping tests"

      # Frontend
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

# ============================================================
# JOB 2 - SONARCLOUD ANALYSIS
# ============================================================
  sonarcloud:
    name: SonarCloud Code Analysis
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

# ============================================================
# JOB 3 - BUILD & PUSH DOCKER IMAGES
# ============================================================
  build-and-push:
    name: Build and Push Docker Images
    needs: sonarcloud
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login DockerHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Backend Image
      - name: Build & Push Backend Image
        id: backend_build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: vipulsingh2200/think_back:latest

      # Frontend Image
      - name: Build & Push Frontend Image
        id: frontend_build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: vipulsingh2200/think_front:latest

      # Success Message
      - name: Build Successful
        if: success()
        run: |
          echo "✅ Backend Image Pushed Successfully"
          echo "Backend Digest: ${{ steps.backend_build.outputs.digest }}"
          echo "✅ Frontend Image Pushed Successfully"
          echo "Frontend Digest: ${{ steps.frontend_build.outputs.digest }}"
          echo "🎉 CI/CD Pipeline Build Completed Successfully."

      # Failure Message
      - name: Build Failed
        if: failure()
        run: |
          echo "❌ Docker Build or Push Failed."
          echo "Check the logs above for more information."

# ============================================================
# JOB 4 - DEPLOY TO AWS EC2
# ============================================================
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/mern-app

            echo "🚀 Pulling latest images..."
            docker pull vipulsingh2200/think_back:latest
            docker pull vipulsingh2200/think_front:latest

            echo "🛑 Stopping old containers..."
            docker-compose down || true

            echo "▶️ Starting new containers..."
            docker-compose up -d

            echo "🧹 Cleaning up old images..."
            docker system prune -f

            echo "✅ Deployment complete!"
            docker ps
